name: Refresh timetables from Yandex Disk
on:
  push:
    branches: [main]
    paths: ['scripts/**', 'tests/**', 'requirements.txt', '.github/workflows/sync.yml']
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  # Prepared for an independently authorized scheduler; none is connected.
  repository_dispatch:
    types: [refresh-timetables]
permissions:
  contents: write
  pages: write
concurrency:
  group: timetable-sync
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Rerunning an older Actions job must use the latest main,
          # not the original event SHA (otherwise git push is rejected).
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Download and validate official Excel files
        id: sync
        continue-on-error: true
        run: python scripts/sync.py
      - name: Publish valid data and honest check status
        id: publish
        run: |
          git add data/schedules.json data/sync-status.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'moi-pary-sync[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update verified timetables and check status'
          # Other automation or an editor may have advanced main while
          # we were checking the source. Never force-push stale data.
          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort || true
            echo 'Main changed during the check; preserving remote data. Retry from fresh main.' >&2
            exit 1
          fi
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      # GITHUB_TOKEN pushes do not reliably trigger branch-based Pages builds.
      # Explicitly request the existing Pages build rather than changing hosting mode.
      - name: Request GitHub Pages publication
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${{ github.repository }}/pages/builds
      - name: Report source failure after preserving and publishing working data
        if: steps.sync.outcome == 'failure'
        run: exit 1
